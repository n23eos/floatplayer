<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Настройки — FloatPlayer</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>FloatPlayer <small>Picture in Picture for YouTube</small></h1>

  <label class="row">
    <input type="checkbox" id="autoPip">
    <span>
      Авто-PiP: выносить видео при уходе со вкладки
      <small>Требует Chrome 120+. Chrome сам решает, когда разрешить.</small>
    </span>
  </label>

  <label class="row">
    <span>
      Стиль мини-окна
      <small>«Полный» — панель A-B/скорость/громкость/таймер, но Chrome рисует
      сверху рамку с адресом сайта (убрать её нельзя — требование браузера).
      «Чистое видео» — совсем без рамки, но и без панели: только видео и
      нативные кнопки Chrome.</small>
    </span>
    <select id="windowMode">
      <option value="document">Полный (с панелью)</option>
      <option value="native">Чистое видео (без рамки)</option>
    </select>
  </label>

  <label class="row">
    <input type="checkbox" id="sponsorSkip">
    <span>
      Интеграции на таймлайне (SponsorBlock)
      <small>Спонсорские вставки подсвечиваются зелёным, при попадании в них
      появляется кнопка «Пропустить интеграцию». Данные сообщества SponsorBlock:
      на sponsor.ajay.app отправляется ID видео.</small>
    </span>
  </label>

  <label class="row">
    <span>
      Шаг промотки интеграций
      <small>Кнопка «»N» в мини-окне прыгает вперёд на этот шаг.</small>
    </span>
    <select id="skipStepSeconds">
      <option value="15">15 сек</option>
      <option value="30">30 сек</option>
      <option value="45">45 сек</option>
      <option value="60">60 сек</option>
      <option value="90">90 сек</option>
    </select>
  </label>

  <label class="row">
    <input type="checkbox" id="shortsAutoNext">
    <span>
      Шортсы: автопереход к следующему
      <small>Когда шортс в мини-окне доигрывает, автоматически включается следующий.</small>
    </span>
  </label>

  <label class="row">
    <input type="checkbox" id="compactMode">
    <span>
      Компактный режим панели
      <small>Панель в мини-окне прячется и появляется при наведении.</small>
    </span>
  </label>

  <label class="row">
    <span>Шаг изменения скорости</span>
    <select id="speedStep">
      <option value="0.1">0.1x</option>
      <option value="0.25">0.25x</option>
      <option value="0.5">0.5x</option>
    </select>
  </label>

  <label class="row">
    <span>
      Потолок громкости в мини-окне
      <small>Слайдер всегда идёт от 0%; это верхняя граница усиления.</small>
    </span>
    <select id="volumeBoostMax">
      <option value="100">100% (без усиления)</option>
      <option value="200">200%</option>
      <option value="300">300%</option>
    </select>
  </label>

  <p class="hint">
    Горячие клавиши настраиваются на странице
    <code>chrome://extensions/shortcuts</code>.
  </p>

  <p id="status" class="status" hidden>Сохранено</p>

  <footer class="footer">
    Автор: <a href="https://x.com/Raincoat_talk" target="_blank" rel="noopener">@Raincoat_talk</a>
  </footer>

  <script src="options.js"></script>
</body>
</html>
